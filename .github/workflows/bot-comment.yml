# github-actions[bot] 이름으로 PR에 코멘트를 단다. 봇 코멘트를 시험할 때 쓴다(relay-v2 설계 D161, 스파이크 S7).
# 실행: gh workflow run bot-comment.yml -f pr=<번호> [-f kind=review] [-f body=<본문>]
name: bot-comment

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "코멘트를 달 PR 번호"
        required: true
      kind:
        description: "conversation(대화 코멘트) 또는 review(리뷰 본문과 인라인 코멘트 하나)"
        required: false
        default: conversation
      body:
        description: "코멘트 본문"
        required: false
        default: "봇 코멘트입니다 (시험용)."

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PR: ${{ inputs.pr }}
          KIND: ${{ inputs.kind }}
          BODY: ${{ inputs.body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR);
            const { KIND: kind, BODY: body } = process.env;

            // patch에서 처음 더한 줄의 새 파일 기준 줄 번호. 더한 줄이 없으면 null.
            const firstAddedLine = (patch) => {
              let next = 0;
              for (const text of patch.split('\n')) {
                const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(text);
                if (hunk) next = Number(hunk[1]);
                else if (text.startsWith('+')) return next;
                else if (text.startsWith(' ')) next += 1;
              }
              return null;
            };

            if (kind === 'conversation') {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            } else if (kind === 'review') {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
              const target = files
                .map((file) => ({ path: file.filename, line: firstAddedLine(file.patch ?? '') }))
                .find((t) => t.line !== null);
              if (!target) {
                core.setFailed('인라인 코멘트를 달 더한 줄이 없습니다.');
                return;
              }
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                commit_id: pr.head.sha,
                event: 'COMMENT',
                body,
                comments: [{ path: target.path, line: target.line, side: 'RIGHT', body: `${body} (인라인)` }],
              });
            } else {
              core.setFailed(`kind는 conversation이나 review여야 합니다: ${kind}`);
            }
